<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080008">
<title>I Love You ❤️</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080008; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="heart" aria-label="A heart made from I love you in many languages"></canvas>
<script>
(() => {
  const canvas = document.getElementById("heart");
  const ctx = canvas.getContext("2d");

  const phrases = [
    "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
    "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
    "사랑해", "愛してる", "我爱你", "Σ' αγαπώ",
    "Ik hou van jou", "Jag älskar dig", "Kocham cię",
    "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu"
  ];

  // Each row is a separate text line. The first rows form the two top lobes;
  // the remaining rows create the tapered bottom of the heart.
  const rows = [
    [{x:0.19,w:0.25},{x:0.56,w:0.25}],
    [{x:0.12,w:0.34},{x:0.54,w:0.34}],
    [{x:0.08,w:0.84}],
    [{x:0.04,w:0.92}],
    [{x:0.07,w:0.86}],
    [{x:0.11,w:0.78}],
    [{x:0.15,w:0.70}],
    [{x:0.19,w:0.62}],
    [{x:0.23,w:0.54}],
    [{x:0.27,w:0.46}],
    [{x:0.31,w:0.38}],
    [{x:0.35,w:0.30}],
    [{x:0.39,w:0.22}],
    [{x:0.43,w:0.14}]
  ];

  let width = 0, height = 0, dpr = 1, startTime = 0;
  let lines = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const heartWidth = Math.min(width * 0.94, 560);
    const lineGap = Math.min(31, Math.max(19, height * 0.027));
    const totalHeight = (rows.length - 1) * lineGap;
    const top = (height - totalHeight) / 2;
    lines = [];
    let phraseIndex = 0;

    rows.forEach((segments, rowIndex) => {
      segments.forEach(segment => {
        const maxWidth = heartWidth * segment.w;
        const text = Array.from({length: 4}, () => {
          const p = phrases[phraseIndex % phrases.length];
          phraseIndex++;
          return p;
        }).join("  •  ");

        let fontSize = Math.min(17, Math.max(9, width * 0.027));
        ctx.font = `700 ${fontSize}px Arial, sans-serif`;
        while (ctx.measureText(text).width > maxWidth && fontSize > 7) {
          fontSize -= 0.5;
          ctx.font = `700 ${fontSize}px Arial, sans-serif`;
        }
        // Shorten the line if a very narrow phone cannot fit it.
        let fitted = text;
        while (ctx.measureText(fitted).width > maxWidth && fitted.length > 8) {
          fitted = fitted.slice(0, -1);
        }
        lines.push({
          text: fitted,
          x: width * segment.x + (heartWidth * segment.w) / 2 + (width-heartWidth)/2,
          y: top + rowIndex * lineGap,
          fontSize,
          delay: (rowIndex * 2 + lines.length) * 75
        });
      });
    });
    startTime = performance.now();
  }

  function draw(now) {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "#080008";
    ctx.fillRect(0, 0, width, height);

    const elapsed = now - startTime;
    lines.forEach(line => {
      const alpha = Math.min(1, Math.max(0, (elapsed - line.delay) / 650));
      if (alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = `700 ${line.fontSize}px Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ff365d";
      ctx.shadowColor = "#ff1744";
      ctx.shadowBlur = 7;
      ctx.fillText(line.text, line.x, line.y + (1 - alpha) * 10);
      ctx.restore();
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
