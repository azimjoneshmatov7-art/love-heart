
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Love You ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080008;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
</style>
</head>
<body>
<canvas id="heart"></canvas>
<script>
const c=document.getElementById("heart");
const ctx=c.getContext("2d");
const words=[
"I love you","Seni seviyorum","Te amo","Je t'aime",
"Ich liebe dich","Ti amo","Eu te amo","Я тебя люблю",
"사랑해","愛してる","我爱你","मैं तुमसे प्यार करता हूँ",
"Σ' αγαπώ","Ik hou van jou","Jag älskar dig",
"Kocham cię","ฉันรักเธอ","Anh yêu em",
"Aku cinta kamu","Я тебе кохаю"
];
let W,H,scale,items=[];
function heart(x,y){
return Math.pow(x*x+y*y-1,3)-x*x*y*y*y<=0;
}
function setup(){
let d=Math.min(devicePixelRatio||1,2);
W=c.width=innerWidth*d;
H=c.height=innerHeight*d;
scale=Math.min(W/38,H/38);
items=[];
let n=0;
for(let y=1.25;y>=-1.25;y-=0.075){
for(let x=-1.4;x<=1.4;x+=0.11){
if(heart(x,y)){
items.push({
x:x*16,y:y*16,
word:words[n++%words.length],
delay:n*13+Math.random()*200,
color:`hsl(${350+Math.random()*25},95%,${48+Math.random()*22}%)`
});
}
}
}
}
function draw(t){
ctx.fillStyle="#080008";
ctx.fillRect(0,0,W,H);
let elapsed=t-start;
items.forEach(p=>{
let a=Math.min(1,Math.max(0,(elapsed-p.delay)/900));
if(!a)return;
let x=W/2+p.x*scale;
let y=H/2-p.y*scale;
ctx.globalAlpha=a;
ctx.font=`bold ${Math.max(7,scale*.72)}px Arial`;
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.shadowColor="#ff1744";
ctx.shadowBlur=8*scale/16;
ctx.fillStyle=p.color;
ctx.fillText(p.word,x,y+(1-a)*18);
});
ctx.globalAlpha=1;
ctx.shadowBlur=0;
requestAnimationFrame(draw);
}
let start=0;
setup();
addEventListener("resize",setup);
requestAnimationFrame(t=>{start=t;draw(t)});
</script>
</body>
</html>
